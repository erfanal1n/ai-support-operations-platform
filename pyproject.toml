[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-support-operations-platform"
version = "0.2.0"
description = "A support operations API with policy checked refund workflows."
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "mcp>=2,<3",
  "openai>=1.68,<3",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

