services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support_ops
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5432:5432"
    volumes:
      - support-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  support-postgres:
