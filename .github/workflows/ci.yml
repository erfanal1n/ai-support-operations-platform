name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          cache: true
          run_install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        env:
          LOG_LEVEL: fatal

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm build:web
